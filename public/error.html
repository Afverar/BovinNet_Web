<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BovinNet · Error</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="error-wrap">
  <div class="error-card">
    <div class="error-icon">!</div>
    <h1>No se pudo guardar el registro</h1>
    <p>
      El código de arete <strong>#0231</strong> ya está asignado a otro bovino activo ("Lucero").
      Verifica el código o consulta el registro existente para continuar.
    </p>
    <div class="error-actions">
      <button class="btn btn-outline">Ver registro en conflicto</button>
      <button class="btn btn-primary">Volver al formulario</button>
    </div>
  </div>
</div>

</body>
</html>
